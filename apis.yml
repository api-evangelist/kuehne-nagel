- aid: kuehne-nagel:b2b-customs-edi
  name: Kuehne+Nagel B2B-CustomsEDI API
  description: >-
    Described in the developer portal as being for bespoke customs integrations with
    customers. The published OpenAPI declares two POST operations, /order and /document,
    with no request schemas, no response schemas and no operation descriptions — an
    unschematized EDI pass-through rather than a modelled customs API.
