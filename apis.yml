- aid: kuehne-nagel:ocean-event-inbox
  name: Kuehne+Nagel OceanEventInbox API
  description: >-
    Lets service providers submit container equipment events for shipments booked with
    Kuehne+Nagel, following Digital Container Shipping Association (DCSA) standards.
    Inbound only — Kuehne+Nagel receives events here rather than publishing them.
    Equipment references follow BIC ISO 6346, locations use UN/LOCODE, and carriers are
    identified by SCAC or SMDG code lists.
  humanURL: https://portal.api.kuehne-nagel.com/devportal/apis/ea0d3ea0-3825-4175-bb54-875068074dca/overview
  baseURL: https://gateway.api.kuehne-nagel.com/integration/external/event/container/v1
  tags:
