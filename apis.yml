aid: kuehne-nagel
url: https://raw.githubusercontent.com/api-evangelist/kuehne-nagel/refs/heads/main/apis.yml
name: Kuehne+Nagel
kind: company
description: >-
  Kuehne+Nagel International AG is a Swiss freight forwarder and contract logistics
  provider headquartered in Schindellegi, Switzerland, and one of the largest
  forwarders in the world across sea logistics, air logistics, road logistics and
  contract logistics. As a forwarder it sits in the intermediation layer of the supply
  chain — between shippers on one side and ocean carriers, airlines, hauliers,
  terminals and customs authorities on the other — and most of the data it exposes is
  carrier and terminal data it aggregates rather than originates. Its API posture is
  honest but conditional: a real WSO2-based developer portal at
  portal.api.kuehne-nagel.com lists 17 published APIs and serves every OpenAPI
  definition anonymously, but every subscription is customer-contract gated — a myKN
  account, a Kuehne+Nagel customer ID (CID) and an account manager who completes the
  "customer setup" are stated pre-requisites, so nobody outside a commercial
  relationship can call the gateway. Underneath the REST veneer the company's own
  connectivity page still advertises EDIFACT, ANSI X.12, Tradacoms, RosettaNet, iDOC,
  GS1 and CargoImp over AS2, OFTP-2, (S)FTP and VAN as the primary integration path,
  and its one customs "EDI" API is an unschematized pass-through. One surface —
  OceanEventInbox v1 — is explicitly built to the DCSA equipment-event standard, which
  makes Kuehne+Nagel a non-member implementer of a carrier standards body; the other
  sixteen APIs are proprietary Kuehne+Nagel contracts.
