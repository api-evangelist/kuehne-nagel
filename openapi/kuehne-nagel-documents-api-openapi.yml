components:
  schemas:
    Body_delete_document_api_key_v3_api_key_auth_workspaces__workspace_id__documents__document_id__delete:
      type: object
      properties:
        hard_delete:
          type: boolean
          default: false
          title: Hard Delete
      title: Body_delete_document_api_key_v3_api_key_auth_workspaces__workspace_id__documents__document_id__delete
    DocumentListResponse:
      type: object
      description: Response model for listing documents.
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentResponse'
          title: Documents
        count:
          type: integer
          title: Count
        offset:
          type: integer
          default: 0
          title: Offset
        limit:
          type: integer
          default: 1000
          title: Limit
      required:
      - count
      - documents
      title: DocumentListResponse
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
      title: HTTPValidationError
    Body_upload_document_api_key_v3_api_key_auth_workspaces__workspace_id__documents_post:
      type: object
      properties:
        file:
          type: string
          format: binary
          title: File
      required:
      - file
      title: Body_upload_document_api_key_v3_api_key_auth_workspaces__workspace_id__documents_post
    Body_upload_document_v3_v3_workspaces__workspace_id__documents_post:
      type: object
      properties:
        file:
          type: string
          format: binary
          title: File
      required:
      - file
      title: Body_upload_document_v3_v3_workspaces__workspace_id__documents_post
    Body_delete_document_v3_v3_workspaces__workspace_id__documents__document_id__delete:
      type: object
      properties:
        hard_delete:
          type: boolean
          default: false
          title: Hard Delete
      title: Body_delete_document_v3_v3_workspaces__workspace_id__documents__document_id__delete
    DocumentResponse:
      type: object
      description: Response model for individual document.
      properties:
        document_id:
          type: string
          format: uuid
          title: Document Id
        name:
          type: string
          title: Name
        s3_key_document:
          type: string
          title: S3 Key Document
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      required:
      - document_id
      - name
      - s3_key_document
      title: DocumentResponse
    DeleteDocumentResponse:
      type: object
      description: Response model for document deletion.
      properties:
        success:
          type: boolean
          title: Success
        document_id:
          type: string
          format: uuid
          title: Document Id
      required:
      - document_id
      - success
      title: DeleteDocumentResponse
    ValidationError:
      type: object
      properties:
        loc:
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://gateway.api.kuehne-nagel.com/authorize
          scopes: {}
x-wso2-api-key-header: ApiKey
