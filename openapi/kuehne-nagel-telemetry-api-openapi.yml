        value:
          maximum: 100
          minimum: 0
          type: number
          description: Humidity percentage of the air outside the container.
          format: float
          example: 25.3
        sensorId:
          maxLength: 100
          type: string
          example: 6441f7f9-c814-4775-a1aa-3fc931f67469
    O2Details:
      type: object
      properties:
        percentage:
          maximum: 100
          minimum: 0
          type: number
          description: O2 concentration as a percentage.
          format: float
          example: 33.5
        setpoint:
          maximum: 100
          minimum: 0
          type: number
          description: Asset (e.g. reefer) O2 setpoint in percentage.
          format: float
          example: 33.5
    SupplyTemperature2Telemetry:
      required:
      - sensorId
      - timeDate
      - transmitDate
      - type
      - value
      type: object
      properties:
        transmitDate:
          type: string
          format: date-time
          example: '2024-09-04T16:22:38Z'
        timeDate:
          type: string
          format: date-time
          example: '2024-09-04T14:24:38Z'
        type:
          maxLength: 100
          type: string
          example: SUPPLY_TEMPERATURE_2
          x-extensible-enum:
          - SUPPLY_TEMPERATURE_2
        value:
          maximum: 250
          minimum: -250
          type: number
          description: Temperature in Celsius degrees of the 2nd supply temperature probe.
          format: float
          example: 35.5
        sensorId:
          maxLength: 100
          type: string
          example: 6441f7f9-c814-4775-a1aa-3fc931f67469
    ShockDetails:
      type: object
      properties:
        magnitude:
          maximum: 30
          minimum: 0
          type: number
          description: Magnitude of the highest shock measured in g's.
          format: float
          example: 24.9
        xAxis:
          maximum: 30
          minimum: -30
          type: number
          description: The most extreme acceleration along the x-axis measured in g's.
          format: float
          example: 12.3
        yAxis:
          maximum: 30
          minimum: -30
          type: number
          description: The most extreme acceleration along the y-axis measured in g's.
          format: float
          example: -12.4
        zAxis:
          maximum: 30
          minimum: -30
          type: number
          description: The most extreme acceleration along the z-axis measured in g's.
          format: float
          example: -2.8
    ReturnTemperatureDetails:
      type: object
      properties:
        temperature1:
          maximum: 250
          minimum: -250
          type: number
          description: Temperature in Celsius degrees of the 1st return temperature probe.
          format: float
          example: 33.5
        temperature2:
          maximum: 250
          minimum: -250
          type: number
          description: Temperature in Celsius degrees of the 2st return temperature probe.
          format: float
          example: 33.5
    PowerState:
      maxLength: 100
      type: string
      description: If asset is powered
      example: 'ON'
      x-extensible-enum:
      - 'ON'
      - 'OFF'
    AssetTemperatureSetpointTelemetry:
      required:
      - sensorId
      - timeDate
      - transmitDate
      - type
      - value
      type: object
      properties:
        transmitDate:
          type: string
          format: date-time
          example: '2024-09-04T16:22:38Z'
        timeDate:
          type: string
          format: date-time
          example: '2024-09-04T14:24:38Z'
        type:
          maxLength: 100
          type: string
          example: ASSET_TEMPERATURE_SETPOINT
          x-extensible-enum:
          - ASSET_TEMPERATURE_SETPOINT
        value:
          maximum: 250
          minimum: -100
          type: number
          description: Asset temperature setpoint in degrees Celsius.
          format: float
          example: 25.5
        sensorId:
          maxLength: 100
          type: string
          example: 6441f7f9-c814-4775-a1aa-3fc931f67469
    Telemetry:
      oneOf:
      - $ref: '#/components/schemas/AssetOperationModeTelemetry'
      - $ref: '#/components/schemas/AssetTemperatureSetpointTelemetry'
      - $ref: '#/components/schemas/BatteryTelemetry'
      - $ref: '#/components/schemas/DoorTelemetry'
      - $ref: '#/components/schemas/GeoTelemetry'
      - $ref: '#/components/schemas/HumidityTelemetry'
      - $ref: '#/components/schemas/LightTelemetry'
      - $ref: '#/components/schemas/MotionTelemetry'
      - $ref: '#/components/schemas/PressureTelemetry'
      - $ref: '#/components/schemas/ShockTelemetry'
      - $ref: '#/components/schemas/TemperatureTelemetry'
      - $ref: '#/components/schemas/VibrationTelemetry'
      - $ref: '#/components/schemas/TiltTelemetry'
      - $ref: '#/components/schemas/AmbientAirTemperatureTelemetry'
      - $ref: '#/components/schemas/AmbientHumidityTelemetry'
      - $ref: '#/components/schemas/CargoTelemetry'
      - $ref: '#/components/schemas/CO2Telemetry'
      - $ref: '#/components/schemas/HumiditySetpointTelemetry'
      - $ref: '#/components/schemas/O2Telemetry'
      - $ref: '#/components/schemas/PowerTelemetry'
      - $ref: '#/components/schemas/ReturnTemperatureTelemetry'
      - $ref: '#/components/schemas/SupplyTemperature2Telemetry'
      - $ref: '#/components/schemas/BatteryPackTelemetry'
      - $ref: '#/components/schemas/TemperatureProbeTelemetry'
    BatteryTelemetry:
      required:
      - sensorId
