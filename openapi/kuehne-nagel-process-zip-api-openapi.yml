components:
  schemas:
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
      title: HTTPValidationError
    Body_post_process_zip_v3_api_key_v3_api_key_auth_workspaces__workspace_id__process_zip_post:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: ZIP archive with documents
          title: File
        prompt_id:
          type: string
          format: uuid
          description: The ID of the prompt to use for extraction.
          example: <PROMPT_ID>
          title: Prompt Id
        prompt_kwargs:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional JSON string with template variables. Leave empty if not using template variables.
          example: ''
          title: Prompt Kwargs
        model_type:
          $ref: '#/components/schemas/ModelType'
          default: flash_25
          description: 'The AI model to use. Default: flash_25.'
          example: flash_25
        enforce_schema:
          type: boolean
          default: false
          description: 'Whether to strictly enforce output schema validation. Default: false.'
          example: false
          title: Enforce Schema
        output_schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional JSON Schema for output validation. Overrides prompt schema.
          example: '{"type": "object", "properties": {"field1": {"type": "string"}}}'
          title: Output Schema
        tools:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Optional list of tool names. Leave empty if no tools should be used/available.
          example: []
          title: Tools
        prompt_version_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional specific prompt version ID. Leave empty for latest.
          example: ''
          title: Prompt Version Id
        tag:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional tag to select prompt version. Leave empty for latest.
          example: ''
          title: Tag
        max_retries:
          type: integer
          default: 1
          description: 'Max retry attempts (0-2). Default: 1.'
          example: 1
          maximum: 2
          minimum: 0
          title: Max Retries
        convert_pdf_to_images:
          type: boolean
          default: false
          description: 'If true and the file is a PDF, convert each page to PNG images before LLM processing. This forces the LLM to use OCR capabilities for the entire page content, which can improve extraction quality for PDFs with incomplete or unreliable text layers. Default: false.'
          example: false
          title: Convert Pdf To Images
      required:
      - file
      - prompt_id
      title: Body_post_process_zip_v3_api_key_v3_api_key_auth_workspaces__workspace_id__process_zip_post
    ZipMetadata:
      type: object
      properties:
        total_files:
          type: integer
          title: Total Files
        processed_files:
          type: integer
          title: Processed Files
        errors:
          type: integer
          title: Errors
        started_at:
          type: string
          title: Started At
        completed_at:
          type: string
          title: Completed At
        processing_time_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Processing Time Ms
      required:
      - completed_at
      - errors
      - processed_files
      - started_at
      - total_files
      title: ZipMetadata
    Body_post_process_zip_v2_v2_process_zip__post:
      type: object
      properties:
        workspace:
          type: string
          title: Workspace
        file:
          type: string
          format: binary
          title: File
        prompt_name:
          type: string
          title: Prompt Name
        prompt_kwargs:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Kwargs
        model_type:
          $ref: '#/components/schemas/ModelType'
          default: flash_25
        enforce_schema:
          type: boolean
          default: false
          title: Enforce Schema
      required:
      - file
      - prompt_name
      - workspace
      title: Body_post_process_zip_v2_v2_process_zip__post
    Body_post_process_zip_with_prompt_base64_v3_v3_workspaces__workspace_id__process_zip_with_prompt_base64_post:
      type: object
      properties:
        file_content:
          type: string
          description: Base64 encoded file content (PDF, DOCX, TXT, etc.)
          title: File Content
        filename:
          type: string
          description: Original filename with extension
          example: invoice.pdf
          title: Filename
        prompt:
          type: string
          description: The prompt text to use for extraction. Provide the full prompt instruction here instead of using a saved prompt ID.
          example: Extract all invoice data from the document...
          title: Prompt
        prompt_kwargs:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Optional JSON string containing variables for prompt template substitution (e.g., ''{"company": "Acme Corp", "year": "2024"}''). Leave empty if not using template variables.'
          example: ''
          title: Prompt Kwargs
        model_type:
          $ref: '#/components/schemas/ModelType'
          default: flash_25
          description: 'The AI model to use for extraction. Options: flash_25_lite (fast), flash_25 (more accurate), pro_25. Default: flash_25.'
          example: flash_25
        output_schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional JSON Schema to enforce on the extraction output. When provided, the API will validate extracted data against this schema. This takes precedence over any schema attached to the prompt version. Must be a valid JSON Schema (Draft 2020-12). Leave empty to use the prompt version's schema (if enforce_schema is true) or no schema.
          example: '{"type": "object", "properties": {"field1": {"type": "string"}}}'
          title: Output Schema
        tools:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Optional list of tool names to enable for this extraction (e.g., ['calculator', 'web_search']). Leave empty if no tools should be used/available.
          example: []
          title: Tools
        convert_pdf_to_images:
          type: boolean
          default: false
          description: 'If true and the file is a PDF, convert each page to PNG images before LLM processing. This forces the LLM to use OCR capabilities for the entire page content, which can improve extraction quality for PDFs with incomplete or unreliable text layers. Default: false.'
          example: false
          title: Convert Pdf To Images
      required:
      - file_content
      - filename
      - prompt
      title: Body_post_process_zip_with_prompt_base64_v3_v3_workspaces__workspace_id__process_zip_with_prompt_base64_post
    Body_post_process_zip_async_v3_api_key_v3_api_key_auth_workspaces__workspace_id__async_process_zip_post:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: ZIP archive to process asynchronously
          title: File
        prompt_id:
          type: string
          format: uuid
          description: The ID of the prompt to use for extraction.
          example: <PROMPT_ID>
          title: Prompt Id
        prompt_kwargs:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional JSON string with template variables. Leave empty if not using template variables.
